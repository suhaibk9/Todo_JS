<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
</head>

<body>
    <div class="container">
        <h1>Todo App</h1>
        <input type="text" placeholder="Add A New Todo" id="todo-input" />
        <button id="add-todo">Add Todo</button>
        <div>
            <button class="filterBtn" data-filter="all">All</button>
            <button class="filterBtn" data-filter="pending">Active</button>
            <button class="filterBtn" data-filter="completed">Completed</button>
        </div>
        <ul id="todo-list">
            <!-- Todo items will be dynamically added here -->
        </ul>
    </div>
</body>

</html>
